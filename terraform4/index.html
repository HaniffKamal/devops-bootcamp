<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haniff Kamal · DevOps Bootcamp 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f4f1ff;
      --muted: #a9a3c2;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, #241b4d 0%, transparent 55%),
        #0b0914;
    }

    .card {
      width: min(100%, 26rem);
      padding: 2.75rem 2rem;
      text-align: center;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.45);
      animation: fade-in 0.9s ease-out;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(139, 92, 246, 0.45);
      box-shadow: 0 2rem 5rem rgba(76, 29, 149, 0.3);
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      animation: pulse 2.8s ease-in-out infinite;
    }

    h1 {
      margin: 1.5rem 0 0.5rem;
      font-size: clamp(1.9rem, 7vw, 2.5rem);
      letter-spacing: -0.03em;
    }

    .cohort {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .role {
      display: inline-block;
      margin: 1.25rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #d8caff;
      font-size: 0.95rem;
      font-weight: 600;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.35);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 0 10px rgba(139, 92, 246, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .badge {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">DevOps Bootcamp 2026</span>
    <h1>Haniff Kamal</h1>
    <p class="cohort">Cohort 2026</p>
    <p class="role">DevOps Engineer</p>
  </main>
</body>
</html>
